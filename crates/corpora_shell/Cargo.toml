[package]
name = "corpora_shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT"

[lints]
workspace = true

[lib]
path = "src/corpora_shell.rs"

[features]
default = []

[dependencies]
corpora_config.workspace = true
corpora_foundation.workspace = true
corpora_platform.workspace = true
corpora_runtime.workspace = true
corpora_services.workspace = true
corpora_ui.workspace = true

anyhow.workspace = true
gpui-kit.workspace = true
flume.workspace = true
gpui.workspace = true
gpui-router.workspace = true
gpui-agentation.workspace = true
rust-embed.workspace = true
serde.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
image.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
global-hotkey.workspace = true
windows.workspace = true
