[package]
name = "corpora_config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license = "MIT"

[lints]
workspace = true

[lib]
path = "src/corpora_config.rs"

[features]
default = []
notifications-portal = ["dep:ashpd"]

[dependencies]
corpora_foundation.workspace = true
corpora_platform.workspace = true
corpora_runtime_services.workspace = true
corpora_ui.workspace = true

anyhow.workspace = true
async-trait.workspace = true
atomic-write-file.workspace = true
ely-gpui-component.workspace = true
futures-util.workspace = true
gpui.workspace = true
notify-rust.workspace = true
open.workspace = true
rust-i18n.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
undo.workspace = true
uuid.workspace = true

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.8", features = ["test-support"] }
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-user-notifications.workspace = true
user-notify.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
quick-xml.workspace = true
windows.workspace = true
