name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: macos-latest
    env:
      # Same version as rust-toolchain.toml; set here so CI skips the file's
      # rust-analyzer/rust-src/wasm extras.
      RUSTUP_TOOLCHAIN: "1.98.1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # -D warnings makes this job fail on lints instead of just printing them.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.rust }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.98.1 == rust-toolchain.toml; 1.95.0 == rust-version (MSRV) in Cargo.toml.
        rust: ["1.98.1", "1.95.0"]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.rust }}
      - run: cargo test --no-default-features
      - run: cargo test --all-features
