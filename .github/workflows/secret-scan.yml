# Credential scanning runs for work PRs and promotion drafts marked ready.
name: Secret Scan

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [dev, next, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with the `rev` pinned in .pre-commit-config.yaml so local and CI
  # runs agree on the ruleset.
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: Detect hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: required for the base..head range on pull requests and
          # for the full-history sweep on branch pushes.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # --redact is not optional: without it a finding prints the secret verbatim
      # into a build log that may be publicly readable.
      - name: Scan pull request range
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git . --no-banner --redact --verbose \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Scan full history
        if: github.event_name != 'pull_request'
        run: gitleaks git . --no-banner --redact --verbose
