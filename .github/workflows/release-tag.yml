name: Release Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event.pull_request.merged == true && github.head_ref == 'release/next-to-main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Tag the production squash commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/scripts/release.py release

  deploy:
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/production-deploy.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit
